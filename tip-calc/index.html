<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Tip calculator</title>
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: "Plex Mono"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Plex Mono"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Plex Sans"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }

  :root {
    --font-display: "Plex Mono", monospace;
    --font-data: "Plex Mono", monospace;
    --font-body: "Plex Sans", sans-serif;
    --text-label: 12px; --text-body: 16px; --text-data: 20px; --text-hero: min(48px, 16cqw);
    --color-bg: #ece6d6; --color-surface: #faf7ee; --color-text: #1c1b18; --color-muted: #5b574c;
    --color-accent: #14468f; --color-danger: #a32a1c; --color-line: #857f6d; --color-rule: #d4ccb6;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;
    --radius-control: 4px; --radius-slip: 2px;
    --dur-micro: 100ms; --dur-short: 150ms; --dur-medium: 250ms; --dur-long: 400ms;
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --dur-micro: 0ms; --dur-short: 0ms; --dur-medium: 0ms; --dur-long: 0ms; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { scroll-padding-top: calc(var(--space-16) + var(--space-8)); }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font: 400 var(--text-body)/1.5 var(--font-body);
  }

  .page { max-width: 390px; padding: var(--space-4); }

  .slip {
    background: var(--color-surface);
    border: 1px solid var(--color-rule);
    border-radius: var(--radius-slip);
  }

  .readout {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--color-surface);
    padding: var(--space-3) var(--space-4);
    min-height: calc(var(--space-16) + var(--space-8));
  }
  .readout-label {
    display: block;
    margin: 0;
    font: 400 var(--text-label)/1.5 var(--font-body);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-muted);
  }
  .readout-body { container-type: inline-size; }
  .readout-figure {
    display: block;
    margin: 0;
    text-align: right;
    font: 600 var(--text-hero)/1 var(--font-display);
    font-variant-numeric: tabular-nums;
    color: var(--color-accent);
  }
  .readout-figure[hidden] { display: none; }
  .readout-note {
    margin: 0;
    color: var(--color-muted);
    font: 400 var(--text-body)/1.5 var(--font-body);
  }

  .body { padding: var(--space-6) var(--space-4); }

  .field {
    display: grid;
    grid-template-columns: 88px 1fr;
    align-items: center;
    column-gap: var(--space-3);
    margin-bottom: var(--space-3);
  }
  .field label {
    font: 400 var(--text-label)/1.5 var(--font-body);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-muted);
  }
  .field input {
    width: 100%;
    min-height: var(--space-12);
    padding: var(--space-2) var(--space-3);
    font: 500 var(--text-data)/1.2 var(--font-data);
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--color-text);
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: var(--radius-control);
    transition: border-color var(--dur-short) var(--ease), box-shadow var(--dur-short) var(--ease);
  }
  .field input:focus {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
  .field input[aria-invalid="true"] {
    border-color: var(--color-danger);
    box-shadow: inset 0 0 0 1px var(--color-danger);
  }
  .msg {
    margin: calc(var(--space-2) * -1) 0 var(--space-3);
    color: var(--color-danger);
    font: 400 var(--text-body)/1.5 var(--font-body);
  }

  .rule {
    border: 0;
    border-top: 1px dashed var(--color-line);
    margin: var(--space-4) 0;
  }

  .ledger { margin: 0 0 var(--space-4); }
  .ledger-row {
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
    padding: var(--space-1) 0;
    min-height: var(--space-8);
  }
  .ledger-row dt {
    margin: 0;
    font: 400 var(--text-label)/1.5 var(--font-body);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-muted);
  }
  .lead {
    flex: 1;
    min-width: var(--space-4);
    border-bottom: 1px dotted var(--color-line);
  }
  .ledger-row dd {
    margin: 0;
    font: 500 var(--text-data)/1.2 var(--font-data);
    font-variant-numeric: tabular-nums;
  }

  .rounding { margin: 0; }
  .rounding-line {
    display: block;
    color: var(--color-muted);
    font: 400 var(--text-body)/1.5 var(--font-body);
  }
  .rounding-detail {
    display: block;
    text-align: right;
    color: var(--color-muted);
    font: 500 var(--text-data)/1.2 var(--font-data);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="slip">
      <div class="readout" role="status" aria-atomic="true">
        <span class="readout-label">Each pays</span>
        <div class="readout-body">
          <span class="readout-figure" id="each-figure" hidden></span>
          <p class="readout-note" id="each-note"></p>
        </div>
      </div>

      <div class="body">
        <div class="field">
          <label for="bill">Bill</label>
          <input id="bill" autocomplete="off" inputmode="decimal">
        </div>
        <p class="msg" id="bill-msg" hidden></p>

        <div class="field">
          <label for="tip">Tip %</label>
          <input id="tip" autocomplete="off" inputmode="numeric">
        </div>
        <p class="msg" id="tip-msg" hidden></p>

        <div class="field">
          <label for="people">People</label>
          <input id="people" autocomplete="off" inputmode="numeric">
        </div>
        <p class="msg" id="people-msg" hidden></p>

        <hr class="rule">

        <dl class="ledger">
          <div class="ledger-row"><dt>Tip</dt><span class="lead"></span><dd id="tip-amount"></dd></div>
          <div class="ledger-row"><dt>Total</dt><span class="lead"></span><dd id="total-amount"></dd></div>
        </dl>

        <p class="rounding" id="rounding-note" hidden>
          <span class="rounding-line">Rounded up to the cent.</span>
          <span class="rounding-detail" id="rounding-detail"></span>
        </p>
      </div>
    </div>
  </div>

  <script src="calc.js"></script>
  <script>
  (function () {
    "use strict";

    var billInput = document.getElementById("bill");
    var tipInput = document.getElementById("tip");
    var peopleInput = document.getElementById("people");

    var billMsg = document.getElementById("bill-msg");
    var tipMsg = document.getElementById("tip-msg");
    var peopleMsg = document.getElementById("people-msg");

    var eachFigure = document.getElementById("each-figure");
    var eachNote = document.getElementById("each-note");
    var tipAmount = document.getElementById("tip-amount");
    var totalAmount = document.getElementById("total-amount");
    var roundingNote = document.getElementById("rounding-note");
    var roundingDetail = document.getElementById("rounding-detail");

    var FIELD_MESSAGES = {
      bill: "Bill: enter an amount like 64.50, up to 999999.99.",
      tip: "Tip: enter a whole percent, 0 to 100.",
      people: "People: enter a whole number, 1 to 999."
    };
    var FIELD_WORDS = { bill: "bill", tip: "tip", people: "head count" };
    var FIELD_ORDER = ["bill", "tip", "people"];

    function formatCents(cents) {
      var dollars = Math.floor(cents / 100);
      var remainder = cents % 100;
      return dollars + "." + (remainder < 10 ? "0" + remainder : String(remainder));
    }

    function setFieldState(input, msgEl, fieldName, invalidList) {
      if (invalidList.indexOf(fieldName) !== -1) {
        input.setAttribute("aria-invalid", "true");
        input.setAttribute("aria-describedby", msgEl.id);
        msgEl.textContent = FIELD_MESSAGES[fieldName];
        msgEl.hidden = false;
      } else {
        input.removeAttribute("aria-invalid");
        input.removeAttribute("aria-describedby");
        msgEl.textContent = "";
        msgEl.hidden = true;
      }
    }

    function fieldStatus(fieldName, trimmedValue, invalidList) {
      if (trimmedValue === "") return "blank";
      if (invalidList.indexOf(fieldName) !== -1) return "invalid";
      return "ok";
    }

    function render() {
      var raw = { bill: billInput.value, tip: tipInput.value, people: peopleInput.value };
      var trimmed = { bill: raw.bill.trim(), tip: raw.tip.trim(), people: raw.people.trim() };
      var result = calc(raw);

      setFieldState(billInput, billMsg, "bill", result.invalid);
      setFieldState(tipInput, tipMsg, "tip", result.invalid);
      setFieldState(peopleInput, peopleMsg, "people", result.invalid);

      var firstBad = null;
      for (var i = 0; i < FIELD_ORDER.length; i++) {
        var name = FIELD_ORDER[i];
        var status = fieldStatus(name, trimmed[name], result.invalid);
        if (status !== "ok") { firstBad = { name: name, status: status }; break; }
      }

      if (result.eachCents !== null) {
        eachFigure.textContent = formatCents(result.eachCents);
        eachFigure.hidden = false;
        eachNote.textContent = "";
      } else {
        eachFigure.hidden = true;
        eachFigure.textContent = "";
        var word = FIELD_WORDS[firstBad.name];
        eachNote.textContent = firstBad.status === "blank"
          ? "Type the " + word + ". Each share shows here."
          : "Fix the " + word + " to see each share.";
      }

      tipAmount.textContent = result.tipCents !== null ? formatCents(result.tipCents) : "";
      totalAmount.textContent = result.totalCents !== null ? formatCents(result.totalCents) : "";

      if (result.collectedCents !== null && result.collectedCents !== result.totalCents) {
        var people = result.collectedCents / result.eachCents;
        roundingDetail.textContent = people + " × " + formatCents(result.eachCents) + " = " + formatCents(result.collectedCents);
        roundingNote.hidden = false;
      } else {
        roundingDetail.textContent = "";
        roundingNote.hidden = true;
      }
    }

    billInput.addEventListener("input", render);
    tipInput.addEventListener("input", render);
    peopleInput.addEventListener("input", render);
    window.addEventListener("pageshow", render);
    render();
  })();
  </script>
</body>
</html>
